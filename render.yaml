# ----------------------------------------------------------------------------
# Doctor Application - Render Blueprint (free tier)
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this GitHub repo.
# The SQLite database is NOT rebuilt from any JSON: the committed
# data/doctor_app.db is the single source of truth a host adopts.
# on the first boot (see run.py). Set these env vars in the dashboard if you
# want them:
#   DOCTOR_APP_SECRET   - strong random string (session tokens)
#   CLOUDINARY_ENABLED  - 1 + credentials to keep uploaded images permanent
# ----------------------------------------------------------------------------
services:
  - type: web
    name: doctor-app-admin
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python run.py --host 0.0.0.0
    healthCheckPath: /api/health
