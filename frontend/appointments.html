<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Appointments · Doctor Application</title>
  <meta name="description" content="Hospital OPD/OT duty schedule imported from the backup – the appointment slots patients book against." />

  <link rel="icon" type="image/png" href="assets/app-icon-64.png?v=18" />
  <link rel="apple-touch-icon" href="assets/app-icon-256.png?v=18" />

  <link rel="stylesheet" href="css/theme.css?v=48" />
  <link rel="stylesheet" href="css/layout.css?v=48" />
  <link rel="stylesheet" href="css/components.css?v=48" />

  <script>
    (function () {
      try {
        var stored = localStorage.getItem('doctor_app_theme');
        var dark = stored
          ? stored === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <!-- ================= Header (rendered by js/layout.js) ================= -->
  <header class="site-header" id="topbar"></header>

  <div class="site-main">
    <div class="shell-container">
      <div class="shell">

        <!-- ================= Sidebar (rendered by js/layout.js) ================= -->
        <aside class="shell-sidebar" id="sidebar"></aside>

        <!-- ================= Content column ================= -->
        <div class="shell-body">
          <main class="content">
            <div class="content-inner">

              <!-- Page heading -->
              <div class="page-head">
                <div>
                  <h1>Appointments</h1>
                  <p>OPD / OT duty schedule of every hospital, imported from the local backup – the duty slots patients book appointments against.</p>
                </div>
                <a href="hospitals.html?v=48" class="btn btn-outline">
                  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/></svg>
                  Hospital directory
                </a>
              </div>

              <!-- Table card -->
              <section class="card">
                <div class="table-toolbar">
                  <div class="table-toolbar-left">
                    <select class="select" id="scheduleHospital" aria-label="Filter by hospital" style="width:auto;min-width:14rem;">
                      <option value="all">All hospitals</option>
                    </select>
                    <select class="select" id="scheduleDay" aria-label="Filter by day" style="width:auto;">
                      <option value="all">All days</option>
                      <option>Monday</option><option>Tuesday</option><option>Wednesday</option>
                      <option>Thursday</option><option>Friday</option><option>Saturday</option>
                      <option>Sunday</option>
                    </select>
                    <div class="input-icon">
                      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                      <input class="input" type="search" id="scheduleSearch" placeholder="Search doctor, specialty…" style="min-width:15rem;" />
                    </div>
                  </div>
                  <div class="table-toolbar-right">
                    <span class="text-sm text-muted" id="resultsInfo">Loading…</span>
                  </div>
                </div>

                <div class="table-wrap">
                  <table class="table">
                    <thead>
                      <tr>
                        <th>Hospital</th>
                        <th>Doctor on duty</th>
                        <th>Specialty</th>
                        <th>Day</th>
                        <th>Time</th>
                      </tr>
                    </thead>
                    <tbody id="scheduleTableBody"></tbody>
                  </table>
                  <div class="editor-empty hidden" id="scheduleEmpty">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
                    <span>No duty slot matches this filter.</span>
                  </div>
                </div>
              </section>

            </div>
          </main>
        </div>
      </div>
    </div>
  </div>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <style>
    .appt-doctor { font-weight: 500; }
    .appt-doctor.is-empty { color: var(--muted-foreground); font-weight: 400; font-style: italic; }
    .appt-doctor-link { text-decoration: none; color: var(--primary); }
    .appt-doctor-link:hover { text-decoration: underline; }
    .day-chip {
      display: inline-flex; padding: .2rem .5rem; border-radius: 999px;
      border: 1px solid var(--border); font-size: .75rem; color: var(--muted-foreground);
    }
  </style>

  <script src="js/icons.js?v=48"></script>
  <script src="js/utils.js?v=48"></script>
  <script src="js/api.js?v=48"></script>
  <script src="js/theme.js?v=48"></script>
  <script src="js/layout.js?v=48"></script>
  <script src="js/appointments.js?v=48"></script>
</body>
</html>
